<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checking a message</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F6F4}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #2C5C8F;outline-offset:3px}
@media (prefers-reduced-motion: no-preference){
  .scan{animation:scan 1.6s ease-in-out infinite}
}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(64px)}100%{transform:translateY(0)}}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F4; color: #14201B; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 24px 28px">
  <div style="display: flex; align-items: center; gap: 8px; height: 48px">
    <button aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; color: #14201B; display: flex; align-items: center; justify-content: center; border-radius: 12px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="font-size: 18px; font-weight: 700">Check a message</span>
  </div>

  <div style="margin-top: 22px; display: flex; gap: 16px; align-items: center">
    <div aria-hidden="true" style="position: relative; flex: none; width: 92px; height: 92px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D9DFDB; overflow: hidden">
      <div style="position: absolute; left: 12px; right: 12px; top: 18px; height: 8px; border-radius: 4px; background: #E4E9E6"></div>
      <div style="position: absolute; left: 12px; right: 26px; top: 34px; height: 8px; border-radius: 4px; background: #E4E9E6"></div>
      <div style="position: absolute; left: 12px; right: 18px; top: 50px; height: 8px; border-radius: 4px; background: #E4E9E6"></div>
      <div class="scan" style="position: absolute; left: 0; right: 0; top: 8px; height: 3px; background: #2C5C8F; opacity: .55"></div>
    </div>
    <p role="status" style="margin: 0; font-size: 20px; line-height: 1.35; font-weight: 700">Reading your message…</p>
  </div>

  <p style="margin: 20px 0 0; font-size: 18px; line-height: 1.45; color: #3F4B46">This takes a few seconds. We look for the tricks scammers use and check the contact details against reports from other families.</p>

  <div aria-hidden="true" style="margin-top: 28px; display: flex; flex-direction: column; gap: 12px">
    <div style="height: 30px; width: 70%; border-radius: 10px; background: #E4E9E6"></div>
    <div style="height: 18px; width: 100%; border-radius: 8px; background: #E4E9E6"></div>
    <div style="height: 18px; width: 86%; border-radius: 8px; background: #E4E9E6"></div>
    <div style="margin-top: 14px; height: 18px; width: 50%; border-radius: 8px; background: #E4E9E6"></div>
    <div style="height: 18px; width: 92%; border-radius: 8px; background: #E4E9E6"></div>
  </div>
</div>
</x-dc>

</script>
</body>
</html>
