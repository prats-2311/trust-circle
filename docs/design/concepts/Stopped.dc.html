<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment stopped</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F6F4}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #2C5C8F;outline-offset:3px}
a{color:#1E5A47}a:hover{color:#14402F}
@media (prefers-reduced-motion: no-preference){
  .settle{animation:settle .7s cubic-bezier(.2,.7,.2,1) both}
}
@keyframes settle{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F4; color: #14201B; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 24px 28px">
  <div class="settle" aria-hidden="true" style="width: 88px; height: 88px; border-radius: 999px; background: #E3EDE8; color: #1E5A47; display: flex; align-items: center; justify-content: center">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M8.5 12l2.5 2.5 4.5-4.5"></path></svg>
  </div>
  <h1 style="margin: 26px 0 0; font-size: 32px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em">Payment stopped. Your money is safe.</h1>
  <p style="margin: 12px 0 0; font-size: 19px; line-height: 1.45; color: #3F4B46">Daniel told us he didn't ask for this money. The $800 was never sent.</p>

  <div style="margin-top: 26px; background: #FFFFFF; border-radius: 20px; padding: 18px 20px">
    <h2 style="margin: 0; font-size: 18px; font-weight: 700">What happens next</h2>
    <ul style="list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; font-size: 17px; line-height: 1.4">
      <li style="display: flex; gap: 12px"><svg aria-hidden="true" style="flex: none; margin-top: 3px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E5A47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Sarah has been told.</span></li>
      <li style="display: flex; gap: 12px"><svg aria-hidden="true" style="flex: none; margin-top: 3px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E5A47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>This account is on the shared scam list now, so other families are warned.</span></li>
    </ul>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 58px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 19px; font-weight: 700">Report it to PayPal</button>
    <button style="height: 58px; border: 2px solid #14201B; border-radius: 14px; background: transparent; color: #14201B; font-size: 19px; font-weight: 700">Back to home</button>
    <p style="margin: 2px 0 0; font-size: 16px; line-height: 1.4; color: #3F4B46; text-align: center">Checking first was the right thing to do.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E5A47","options":["#1E5A47","#2C5C8F","#14201B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1E5A47' };
  }
}
</script>
</body>
</html>
