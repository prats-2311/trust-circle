<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margaret's home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F6F4}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #2C5C8F;outline-offset:3px}
a{color:#1E5A47}a:hover{color:#14402F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F4; color: #14201B; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 24px 28px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 17px; font-weight: 700; color: #1E5A47">Trust Circle</span>
    <button aria-label="Alerts" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #14201B; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9"></path><path d="M10 19a2 2 0 0 0 4 0"></path></svg>
    </button>
  </div>

  <h1 style="margin: 20px 0 0; font-size: 32px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em">Hello, Margaret</h1>
  <div style="margin-top: 12px; display: flex; align-items: center; gap: 10px">
    <div style="display: flex">
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 999px; background: #E3EDE8; color: #1E5A47; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; border: 2px solid #F4F6F4">SH</span>
      <span aria-hidden="true" style="width: 34px; height: 34px; margin-left: -8px; border-radius: 999px; background: #E6EEF7; color: #2C5C8F; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; border: 2px solid #F4F6F4">DH</span>
    </div>
    <span style="font-size: 17px; color: #3F4B46">Sarah and Daniel are in your circle</span>
  </div>

  <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 12px">
    <button style="text-align: left; border: 0; border-radius: 20px; background: {{accent}}; color: #FFFFFF; padding: 22px 20px; display: flex; gap: 16px; align-items: flex-start">
      <svg aria-hidden="true" style="flex: none; margin-top: 2px" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path><path d="M9 10.5l2 2 4-4"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 22px; font-weight: 800">Check a message</span>
        <span style="font-size: 17px; line-height: 1.4; opacity: .92">Paste a text or add a screenshot. We'll tell you if it looks like a scam.</span>
      </span>
    </button>
    <button style="text-align: left; border: 2px solid #14201B; border-radius: 20px; background: #FFFFFF; color: #14201B; padding: 20px; display: flex; gap: 16px; align-items: flex-start">
      <svg aria-hidden="true" style="flex: none; margin-top: 2px" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 22px; font-weight: 800">Send money</span>
        <span style="font-size: 17px; line-height: 1.4; color: #3F4B46">We look at every payment before it goes.</span>
      </span>
    </button>
  </div>

  <h2 style="margin: 30px 0 0; font-size: 19px; font-weight: 700">Recent</h2>
  <ul style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column">
    <li style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #DCE3DF">
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 17px; font-weight: 700">Message checked</span>
        <span style="font-size: 16px; color: #4A5651">Today, 2:10 pm</span>
      </span>
      <span style="flex: none; height: 30px; padding: 0 12px; border-radius: 999px; background: #F8E5E3; color: #8A231E; font-size: 16px; font-weight: 700; display: flex; align-items: center">Likely a scam</span>
    </li>
    <li style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #DCE3DF">
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 17px; font-weight: 700">$320 to the vet clinic</span>
        <span style="font-size: 16px; color: #4A5651">Tuesday</span>
      </span>
      <span style="flex: none; height: 30px; padding: 0 12px; border-radius: 999px; background: #E3EDE8; color: #14402F; font-size: 16px; font-weight: 700; display: flex; align-items: center">Sent</span>
    </li>
  </ul>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #FFFFFF; font-size: 16px; line-height: 1.4; color: #3F4B46">
    <svg aria-hidden="true" style="flex: none" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E5A47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
    <span>Your family safe word is set.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E5A47","options":["#1E5A47","#2C5C8F","#14201B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1E5A47' };
  }
}
</script>
</body>
</html>
