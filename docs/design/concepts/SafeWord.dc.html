<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask for the safe word</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F6F4}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2C5C8F;outline-offset:3px}
a{color:#1E5A47}a:hover{color:#14402F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F4; color: #14201B; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 24px 28px">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
    <button aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; color: #14201B; display: flex; align-items: center; justify-content: center; border-radius: 12px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; border-radius: 999px; background: #E6EEF7; color: #24456B; font-size: 16px; font-weight: 700">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"></rect><rect x="14" y="4" width="4" height="16" rx="1.5"></rect></svg>
      $800 on hold
    </span>
  </div>

  <div aria-hidden="true" style="margin-top: 22px; width: 64px; height: 64px; border-radius: 20px; background: #E3EDE8; color: #1E5A47; display: flex; align-items: center; justify-content: center">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
  </div>
  <h1 style="margin: 18px 0 0; font-size: 30px; line-height: 1.18; font-weight: 800; letter-spacing: -0.01em">Ask the caller for your family's safe word</h1>
  <p style="margin: 10px 0 0; font-size: 18px; line-height: 1.45; color: #3F4B46">Don't say it first or give any hints. Type exactly what they say.</p>

  <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 8px">
    <label for="said" style="font-size: 18px; font-weight: 700">What the caller said</label>
    <input id="said" autocomplete="off" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid #B9C4BE; border-radius: 14px; background: #FFFFFF; color: #14201B; font-size: 20px">
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 58px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 19px; font-weight: 700">Check the safe word</button>
    <button style="height: 52px; border: 0; background: transparent; color: #8A231E; font-size: 18px; font-weight: 700; text-decoration: underline; text-underline-offset: 4px">They couldn't tell me</button>
    <p style="margin: 2px 0 0; font-size: 15px; line-height: 1.4; color: #4A5651; text-align: center">If it doesn't match, we stop the payment. The money stays in your account.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E5A47","options":["#1E5A47","#2C5C8F","#14201B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1E5A47' };
  }
}
</script>
</body>
</html>
