services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: trustcircle
      POSTGRES_PASSWORD: trustcircle
      POSTGRES_DB: trustcircle
    ports: ["5433:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
  db-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: trustcircle
      POSTGRES_PASSWORD: trustcircle
      POSTGRES_DB: trustcircle_test
    ports: ["5434:5432"]
volumes:
  db-data:
