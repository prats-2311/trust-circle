name: ci
on:
  push: { branches: [main] }
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image as docker-compose's db-test, so the integration tests run against real Postgres with pgvector.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trustcircle
          POSTGRES_PASSWORD: trustcircle
          POSTGRES_DB: trustcircle_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U trustcircle" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://trustcircle:trustcircle@localhost:5434/trustcircle_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.12.0", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:int
