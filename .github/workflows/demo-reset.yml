name: demo reset
on:
  schedule: [{ cron: "0 9 * * *" }]
  workflow_dispatch: {}
jobs:
  demo-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/cron/demo-reset" > /dev/null
